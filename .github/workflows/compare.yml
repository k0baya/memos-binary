name: Check Updates

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check this repository for a complete latest stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py check-update

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.check.outputs.tag }}
      publish: true
